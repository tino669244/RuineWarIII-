<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RuineWarIII 2025 Online</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      background-color: #000;
      color: #fff;
    }

    /* Intro screen */
    #intro {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      font-size: 5em;
      font-weight: bold;
      animation: fadeOut 3s forwards;
      z-index: 10;
      position: absolute;
      width: 100%;
    }

    @keyframes fadeOut {
      0% { opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; display: none; }
    }

    /* Background war image */
    #war-scene {
      display: none;
      position: absolute;
      width: 100%;
      height: 100%;
      background: url('https://i.imgur.com/9gHqjYx.jpg') no-repeat center center/cover;
      z-index: 1;
    }

    /* Login form */
    #login {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0,0,0,0.7);
      padding: 40px;
      border-radius: 10px;
      text-align: center;
      z-index: 20;
    }

    #login input {
      display: block;
      margin: 15px auto;
      padding: 10px;
      width: 250px;
      border-radius: 5px;
      border: none;
      font-size: 1em;
    }

    #login button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 1em;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      background-color: #ff0000;
      color: #fff;
    }

    /* Loading bar */
    #loading {
      display: none;
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 25px;
      background-color: #333;
      border-radius: 12px;
      overflow: hidden;
    }

    #loading-bar {
      width: 0%;
      height: 100%;
      background-color: #ff0000;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <div id="intro">Ruine War III</div>
  <div id="war-scene"></div>

  <div id="login">
    <h2>Login to Play</h2>
    <input type="email" placeholder="Email">
    <button onclick="login('email')">Login with Email</button>
    <button onclick="login('facebook')">Login with Facebook</button>
  </div>

  <div id="loading">
    <div id="loading-bar"></div>
  </div>

  <script>
    // Show war scene after intro
    setTimeout(() => {
      document.getElementById('intro').style.display = 'none';
      document.getElementById('war-scene').style.display = 'block';
      setTimeout(() => {
        document.getElementById('login').style.display = 'block';
      }, 2000); // show login 2s after war image
    }, 3000); // intro duration

    function login(method) {
      document.getElementById('login').style.display = 'none';
      document.getElementById('loading').style.display = 'block';
      let bar = document.getElementById('loading-bar');
      let width = 0;
      let interval = setInterval(() => {
        if (width >= 100) {
          clearInterval(interval);
          alert("Login Successful! Start Game...");
          // Here you can redirect to the main game page
        } else {
          width += 1;
          bar.style.width = width + '%';
        }
      }, 30);
    }
  </script>

</body>
</html>
