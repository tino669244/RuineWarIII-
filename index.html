<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RuineWarIII 2025 Online</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>
<div id="game-container">
  <!-- HUD -->
  <div id="hud">
    <div id="stage-info">Stage 1 - Round 1</div>
    <div id="timer">30s</div>
    <div id="player-stats">
      <div>Health: <div class="bar"><div class="bar-fill" id="health-bar"></div></div></div>
      <div>Armor: <div class="bar"><div class="bar-fill" id="armor-bar"></div></div></div>
      <div>Bullets: 30/100</div>
      <div>Grade: 1 <span id="stars">★☆☆</span></div>
    </div>
    <div id="mini-map"></div>
    <div id="points">Points: 0</div>
  </div>

  <!-- Zone Selection -->
  <div id="zone-selection">
    <h2>Select Battlefield</h2>
    <button onclick="selectZone('irochima')">Irochima</button>
    <button onclick="selectZone('nepal')">Nepal</button>
  </div>

  <!-- Example players -->
  <div class="player" style="top: 300px; left: 100px;" id="player1">
    <div class="player-icon"></div>
    <div class="grade">Grade 1</div>
    <div class="stars"><div class="stars-bar" id="stars1"></div></div>
  </div>
  <div class="player" style="top: 300px; left: 300px;" id="player2">
    <div class="player-icon"></div>
    <div class="grade">Grade 1</div>
    <div class="stars"><div class="stars-bar" id="stars2"></div></div>
  </div>
  <div class="player" style="top: 300px; left: 500px;" id="player3">
    <div class="player-icon"></div>
    <div class="grade">Grade 1</div>
    <div class="stars"><div class="stars-bar" id="stars3"></div></div>
  </div>
  <div class="player" style="top: 300px; left: 700px;" id="player4">
    <div class="player-icon"></div>
    <div class="grade">Grade 1</div>
    <div class="stars"><div class="stars-bar" id="stars4"></div></div>
  </div>
</div>

<script src="js/main.js"></script>
<script src="js/controls.js"></script>
<script src="js/ui.js"></script>
<script src="js/multiplayer.js"></script>
</body>
</html>
