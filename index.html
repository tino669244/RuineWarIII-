<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RuineWarIII 2025 Online - Stage Template</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    background-color: #000;
    font-family: Arial, sans-serif;
    color: #fff;
    overflow: hidden;
  }

  #game-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: url('https://i.imgur.com/9gHqjYx.jpg') no-repeat center center/cover;
  }

  /* Stage & Round Info */
  #stage-info {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 2em;
    text-align: center;
    background: rgba(0,0,0,0.5);
    padding: 10px 20px;
    border-radius: 10px;
  }

  /* Player container */
  .player {
    position: absolute;
    width: 80px;
    height: 80px;
    text-align: center;
  }

  .player-icon {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background-color: #f00;
    margin: 0 auto;
    border: 2px solid #fff;
  }

  .grade {
    margin-top: 5px;
    font-size: 0.8em;
  }

  .stars {
    height: 10px;
    width: 100%;
    background-color: #333;
    border-radius: 5px;
    margin-top: 5px;
    overflow: hidden;
  }

  .stars-bar {
    height: 100%;
    width: 0%;
    background-color: gold;
  }

  /* Round / Points Display */
  #points {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.5em;
    background: rgba(0,0,0,0.5);
    padding: 10px 20px;
    border-radius: 10px;
  }
</style>
</head>
<body>

<div id="game-container">
  <div id="stage-info">Stage 1 - Round 1</div>
  
  <!-- Example players -->
  <div class="player" style="top: 200px; left: 100px;" id="player1">
    <div class="player-icon"></div>
    <div class="grade">Grade 1</div>
    <div class="stars"><div class="stars-bar" id="stars1"></div></div>
  </div>

  <div class="player" style="top: 200px; left: 300px;" id="player2">
    <div class="player-icon"></div>
    <div class="grade">Grade 1</div>
    <div class="stars"><div class="stars-bar" id="stars2"></div></div>
  </div>

  <div class="player" style="top: 200px; left: 500px;" id="player3">
    <div class="player-icon"></div>
    <div class="grade">Grade 1</div>
    <div class="stars"><div class="stars-bar" id="stars3"></div></div>
  </div>

  <div class="player" style="top: 200px; left: 700px;" id="player4">
    <div class="player-icon"></div>
    <div class="grade">Grade 1</div>
    <div class="stars"><div class="stars-bar" id="stars4"></div></div>
  </div>

  <div id="points">Points: 0</div>
</div>

<script>
  // Example: Stage and Round
  let stage = 1;
  let round = 1;
  let points = 0;

  const stageInfo = document.getElementById('stage-info');
  const pointsDisplay = document.getElementById('points');

  function nextRound() {
    round++;
    if (round > 5) {
      round = 1;
      stage++;
    }
    stageInfo.textContent = `Stage ${stage} - Round ${round}`;
  }

  // Example: Add points and star progression
  function addPoints(playerId, pts) {
    points += pts;
    pointsDisplay.textContent = `Points: ${points}`;
    
    // Update stars bar
    const starsBar = document.getElementById(`stars${playerId}`);
    let width = parseInt(starsBar.style.width) || 0;
    width += pts * 2; // increase proportionally
    if(width > 100) width = 100;
    starsBar.style.width = width + '%';
    
    // Upgrade grade if stars full
    const player = document.getElementById(`player${playerId}`);
    if(width >= 100){
      const gradeEl = player.querySelector('.grade');
      let currentGrade = parseInt(gradeEl.textContent.replace('Grade ',''));
      gradeEl.textContent = `Grade ${currentGrade+1}`;
      starsBar.style.width = '0%';
    }
  }

  // Example usage: simulate points for player 1 every 2s
  setInterval(() => addPoints(1, 5), 2000);
</script>

</body>
</html>
